server:
  port: 8080

spring:
  application:
    name: alshamel
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # createDatabaseIfNotExist=true 会在连接时自动创建数据库（需 MySQL 账号有建库权限）
    url: jdbc:mysql://localhost:3306/alshamel?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      encoding: UTF-8
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.alshamel.mall.entity
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    secret: Alshamel-Inventory-Adjustment-Demo-JWT-Secret-Key-2026-ChangeMe
    expiration-ms: 86400000
